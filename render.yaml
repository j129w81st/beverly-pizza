# Deploy from Render > New > Blueprint after connecting this repository.
# Free web service only. Supabase supplies storage; GitHub Actions runs refreshes.
services:
  - type: web
    name: beverly-pizza
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
