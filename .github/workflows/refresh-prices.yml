name: Refresh pizza prices
on:
  push:
    branches: [main]
    paths:
      - data.js
      - prices.js
      - scripts/refresh.js
      - collectors.js
      - db.js
      - package-lock.json
      - .github/workflows/refresh-prices.yml
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-pizza-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          RUN_BROWSER_TESTS: '1'
      - name: Check database configuration
        run: node -e 'if (!process.env.DATABASE_URL) throw new Error("Add the DATABASE_URL repository secret before running refreshes")'
      - run: npm run refresh -- --force
