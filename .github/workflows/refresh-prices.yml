name: Refresh pizza prices
on:
  push:
    branches: [main]
    paths:
      - data.js
      - prices.js
      - scripts/refresh.js
      - collectors.js
      - ocr.js
      - db.js
      - review-schema.js
      - review-store.js
      - pizza-size.js
      - admin.js
      - review-model.js
      - server-app.js
      - test/**
      - package-lock.json
      - .github/workflows/refresh-prices.yml
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-pizza-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: beverly-ci-test
          POSTGRES_DB: beverly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          RUN_BROWSER_TESTS: '1'
          RUN_OCR_TESTS: '1'
          TEST_DATABASE_URL: postgres://postgres:beverly-ci-test@127.0.0.1:5432/beverly_test
      - name: Check database configuration
        run: node -e 'if (!process.env.DATABASE_URL) throw new Error("Add the DATABASE_URL repository secret before running refreshes")'
      - run: npm run refresh -- --force
      - name: Save menu review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-review-report
          path: .local/collector-reviews.json
          if-no-files-found: ignore
          retention-days: 7
